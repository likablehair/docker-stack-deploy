name: 'Docker Stack Deploy Action'
description: 'Deploy a Docker stack on a Docker Swarm'
author: 'kitconcept GmbH'
branding:
  icon: 'truck'
  color: 'red'
inputs:
  registry:
    description: 'Container registry to use'
    required: false
    default: ""
  username:
    description: 'Container registry username'
    required: false
    default: ""
  password:
    description: 'Container registry password'
    required: false
    default: ""
  remote_host:
    description: 'Host running Docker Swarm'
    required: true
  remote_port:
    description: 'SSH port on the host running Docker Swarm'
    required: false
    default: "22"
  remote_user:
    description: 'User to connect to remote host'
    required: true
  with_cert:
    description: 'Use certificate for ssh authentication'
    required: false
    default: "false"
  remote_private_key:
    description: 'Private key used for ssh authentication (String content)'
    required: false 
    default: ""
  remote_private_key_file:
    description: 'Path to file containing private key (Overrides remote_private_key)'
    required: false
    default: ""
  remote_private_key_cert:
    description: 'Public key used for ssh authentication (String content)'
    required: false
    default: ""
  remote_private_key_cert_file:
    description: 'Path to file containing public key cert (Overrides remote_private_key_cert)'
    required: false
    default: ""
  deploy_timeout:
    description: "Timeout for the deploy check (in seconds)"
    required: false
    default: "600"
  stack_file:
    description: "Path to the stack file to be used for deploy. You can write multiple stack files separated by comma (e.g. stack1.yml,stack2.yml) for the docker merge/override"
    required: true
  stack_name:
    description: "Name of the stack to be deployed"
    required: true
  stack_param:
    description: "Additional stack parameter value"
    required: false
    default: ""
  env_file:
    description: "Additional environment variables in the format VAR_01=VALUE\nVAR_02=VALUE"
    required: false
    default: ""
  debug:
    description: "Debug information"
    required: false
    default: "0"
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    REGISTRY: ${{ inputs.registry }}
    USERNAME: ${{ inputs.username }}
    PASSWORD: ${{ inputs.password }}
    REMOTE_HOST: ${{ inputs.remote_host }}
    REMOTE_PORT: ${{ inputs.remote_port }}
    REMOTE_USER: ${{ inputs.remote_user }}
    WITH_CERT: ${{ inputs.with_cert }}
    REMOTE_PRIVATE_KEY: ${{ inputs.remote_private_key }}
    REMOTE_PRIVATE_KEY_FILE: ${{ inputs.remote_private_key_file }}
    REMOTE_PRIVATE_KEY_CERT: ${{ inputs.remote_private_key_cert }}
    REMOTE_PRIVATE_KEY_CERT_FILE: ${{ inputs.remote_private_key_cert_file }}
    REMOTE_PRIVATE_KEY_FOLDER: ${{ inputs.remote_private_key_folder }}
    DEPLOY_TIMEOUT: ${{ inputs.deploy_timeout }}
    STACK_FILE: ${{ inputs.stack_file }}
    STACK_NAME: ${{ inputs.stack_name }}
    STACK_PARAM: ${{ inputs.stack_param }}
    ENV_FILE: ${{ inputs.env_file }}
    DEBUG: ${{ inputs.debug }}
